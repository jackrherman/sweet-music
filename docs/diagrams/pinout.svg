<text x="40" y="56" font-size="26" fill="#000">Raspberry Pi header -&gt; HUB75</text>
<text x="40" y="86" font-size="13" fill="#000">Mapping used by the "adafruit-hat-pwm" profile. The bonnet makes these connections for you.</text>
<text x="40" y="108" font-size="13" fill="#000">Filled pins are driven by the matrix. E and the GPIO4-to-GPIO18 PWM bridge are the two you add by hand.</text>
