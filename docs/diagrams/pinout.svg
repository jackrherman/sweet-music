<rect x="750" y="522" width="230" height="120" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="764" y="546" font-size="12" fill="#000">THE E LINE</text>
<text x="764" y="568" font-size="11" fill="#000">64x64 = 1/32 scan = needs E.</text>
<text x="764" y="588" font-size="11" fill="#000">Bonnet leaves it unconnected.</text>
<text x="764" y="608" font-size="11" fill="#000">Solder pad E to pad 8.</text>
<text x="764" y="628" font-size="11" fill="#000">Garbled top half -&gt; use pad 16.</text>
<rect x="750" y="662" width="230" height="140" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="764" y="686" font-size="12" fill="#000">THE PWM MOD</text>
<text x="764" y="708" font-size="11" fill="#000">Solder GPIO4 to GPIO18.</text>
<text x="764" y="728" font-size="11" fill="#000">OE then runs off hardware PWM,</text>
<text x="764" y="748" font-size="11" fill="#000">not a preemptible thread.</text>
<text x="764" y="768" font-size="11" fill="#000">91Hz -&gt; 154Hz. Needs</text>
<text x="764" y="786" font-size="9.5" fill="#000">--led-gpio-mapping=adafruit-hat-pwm</text>
<text x="40" y="804" font-size="12" fill="#000">config.txt parks exactly these 15 pins before the kernel starts, so the</text>
<text x="40" y="822" font-size="12" fill="#000">bonnet's 74AHCT245 buffers never see floating inputs. OE is active low, so both</text>
<text x="40" y="840" font-size="12" fill="#000">ends of the PWM bridge are parked high:</text>
<text x="40" y="864" font-size="12.5" fill="#000">gpio=4=op,dh</text>
<text x="40" y="882" font-size="12.5" fill="#000">gpio=18=op,dh</text>
<text x="440" y="864" font-size="12.5" fill="#000">gpio=5,6,12,13,16,17,20,21,22,23,24,26,27=op,dl</text>
</svg>