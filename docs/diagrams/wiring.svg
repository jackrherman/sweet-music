<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="DejaVu Sans Mono, Consolas, monospace">
  <rect width="1000" height="720" fill="#ffffff"/>
  <g stroke="#000000" fill="none" stroke-width="1.6"/>

  <text x="700" y="60" font-size="30" fill="#000">Wiring</text>
  <text x="700" y="94" font-size="30" fill="#000">diagram</text>
  <text x="700" y="128" font-size="30" fill="#000">for</text>
  <text x="700" y="162" font-size="30" fill="#000">Sweet Music</text>

  <!-- ================= PSU ================= -->
  <rect x="40" y="420" width="150" height="90" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="115" y="452" font-size="13" text-anchor="middle" fill="#000">5V 5A PSU</text>
  <text x="60" y="480" font-size="12" fill="#000">+5V</text>
  <text x="60" y="500" font-size="12" fill="#000">GND</text>
  <circle cx="190" cy="476" r="3.5" fill="#000"/>
  <circle cx="190" cy="496" r="3.5" fill="#000"/>

  <!-- ================= BONNET ================= -->
  <rect x="300" y="230" width="230" height="230" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="415" y="256" font-size="14" text-anchor="middle" fill="#000">ADAFRUIT RGB</text>
  <text x="415" y="274" font-size="14" text-anchor="middle" fill="#000">MATRIX BONNET</text>

  <!-- screw terminal -->
  <rect x="312" y="292" width="86" height="46" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="355" y="310" font-size="10.5" text-anchor="middle" fill="#000">SCREW</text>
  <text x="355" y="324" font-size="10.5" text-anchor="middle" fill="#000">TERMINAL</text>
  <circle cx="312" cy="303" r="3.5" fill="#000"/>
  <circle cx="312" cy="327" r="3.5" fill="#000"/>
  <text x="292" y="300" font-size="10" text-anchor="end" fill="#000">5V</text>
  <text x="292" y="331" font-size="10" text-anchor="end" fill="#000">GND</text>

  <!-- HUB75 idc on bonnet -->
  <rect x="440" y="292" width="78" height="120" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="479" y="312" font-size="10.5" text-anchor="middle" fill="#000">HUB75</text>
  <text x="479" y="326" font-size="10.5" text-anchor="middle" fill="#000">16 PIN</text>
  <text x="479" y="346" font-size="10.5" text-anchor="middle" fill="#000">IDC</text>
  <circle cx="518" cy="370" r="3.5" fill="#000"/>

  <!-- E bridge callout on bonnet -->
  <circle cx="340" cy="382" r="12" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="386" font-size="10" text-anchor="middle" fill="#000">E</text>
  <circle cx="382" cy="382" r="12" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="382" y="386" font-size="10" text-anchor="middle" fill="#000">8</text>
  <path d="M352 382 L370 382" stroke="#000" stroke-width="5"/>
  <text x="316" y="418" font-size="10.5" fill="#000">SOLDER BRIDGE (64x64)</text>

  <!-- ================= PI ================= -->
  <rect x="300" y="500" width="230" height="86" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="415" y="528" font-size="14" text-anchor="middle" fill="#000">RASPBERRY PI</text>
  <text x="415" y="546" font-size="14" text-anchor="middle" fill="#000">ZERO W / 2 W</text>
  <text x="415" y="570" font-size="10.5" text-anchor="middle" fill="#000">USB PWR: NOT CONNECTED</text>

  <!-- pi to bonnet: 40 pin header -->
  <path d="M415 500 L415 460" stroke="#000" stroke-width="1.6"/>
  <text x="425" y="484" font-size="10.5" fill="#000">40-PIN HEADER</text>

  <!-- ================= PANEL ================= -->
  <rect x="700" y="230" width="230" height="230" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="815" y="256" font-size="14" text-anchor="middle" fill="#000">64x64 P4 PANEL</text>
  <text x="815" y="274" font-size="11" text-anchor="middle" fill="#000">HUB75 . 1/32 SCAN</text>

  <rect x="700" y="330" width="70" height="46" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="735" y="350" font-size="10" text-anchor="middle" fill="#000">INPUT</text>
  <text x="735" y="366" font-size="10" text-anchor="middle" fill="#000">16 PIN</text>
  <circle cx="700" cy="353" r="3.5" fill="#000"/>

  <rect x="700" y="396" width="70" height="44" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="735" y="414" font-size="9.5" text-anchor="middle" fill="#000">VCC VCC</text>
  <text x="735" y="430" font-size="9.5" text-anchor="middle" fill="#000">GND GND</text>
  <circle cx="700" cy="408" r="3.5" fill="#000"/>
  <circle cx="700" cy="428" r="3.5" fill="#000"/>

  <text x="815" y="470" font-size="10.5" text-anchor="middle" fill="#000">CHECK ARROW ON PCB SILKSCREEN</text>

  <!-- ================= WIRES ================= -->
  <!-- PSU +5V -> bonnet screw terminal 5V -->
  <path d="M190 476 L240 476 L240 303 L312 303" stroke="#000" stroke-width="1.8" fill="none"/>
  <!-- PSU GND -> bonnet screw terminal GND -->
  <path d="M190 496 L216 496 L216 327 L312 327" stroke="#000" stroke-width="1.8" fill="none"/>

  <!-- 4-pin harness branches from the same 5V/GND rail, routed clear of everything -->
  <circle cx="240" cy="476" r="3.5" fill="#000"/>
  <path d="M240 476 L240 618 L650 618 L650 408 L700 408" stroke="#000" stroke-width="1.8" fill="none"/>
  <circle cx="216" cy="496" r="3.5" fill="#000"/>
  <path d="M216 496 L216 640 L676 640 L676 428 L700 428" stroke="#000" stroke-width="1.8" fill="none"/>
  <text x="300" y="610" font-size="10.5" fill="#000">4-PIN POWER HARNESS (5V / GND)</text>

  <!-- ribbon -->
  <path d="M518 370 L600 370 L600 353 L700 353" stroke="#000" stroke-width="3.2" fill="none"/>
  <text x="556" y="336" font-size="10.5" fill="#000">16-WAY RIBBON</text>

  <!-- notes -->
  <text x="40" y="676" font-size="11.5" fill="#000">POWER ORDER: PSU FIRST.</text>
  <text x="40" y="696" font-size="11.5" fill="#000">NEVER USB + PSU TOGETHER.</text>
  <text x="560" y="676" font-size="11.5" fill="#000">PANEL PULLS ~4A AT FULL WHITE.</text>

  <text x="700" y="196" font-size="11" fill="#000">PI IS POWERED THROUGH</text>
  <text x="700" y="212" font-size="11" fill="#000">THE BONNET HEADER</text>
</svg>
