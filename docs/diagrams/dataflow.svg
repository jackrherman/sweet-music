<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="DejaVu Sans Mono, Consolas, monospace">
  <rect width="1040" height="720" fill="#ffffff"/>

  <text x="40" y="52" font-size="24" fill="#000">Software flow</text>
  <text x="40" y="80" font-size="13" fill="#000">Two poller threads keep shared state. The render loop reads it and only</text>
  <text x="40" y="100" font-size="13" fill="#000">writes to the panel when the picture actually changes.</text>

  <!-- ============ SOURCES ============ -->
  <rect x="40" y="150" width="200" height="86" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="140" y="180" font-size="13" text-anchor="middle" fill="#000">SPOTIFY WEB API</text>
  <text x="140" y="202" font-size="10.5" text-anchor="middle" fill="#000">currently-playing</text>
  <text x="140" y="220" font-size="10.5" text-anchor="middle" fill="#000">poll 4s</text>

  <rect x="40" y="300" width="200" height="86" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="140" y="330" font-size="13" text-anchor="middle" fill="#000">NIGHTSCOUT</text>
  <text x="140" y="352" font-size="10.5" text-anchor="middle" fill="#000">/api/v1/entries.json</text>
  <text x="140" y="370" font-size="10.5" text-anchor="middle" fill="#000">poll 60s</text>

  <!-- ============ STATE ============ -->
  <rect x="330" y="150" width="220" height="86" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="180" font-size="12.5" text-anchor="middle" fill="#000">SharedPlaybackState</text>
  <text x="440" y="202" font-size="10.5" text-anchor="middle" fill="#000">art . is_playing</text>
  <text x="440" y="220" font-size="10.5" text-anchor="middle" fill="#000">progress . duration</text>

  <rect x="330" y="300" width="220" height="86" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="440" y="330" font-size="12.5" text-anchor="middle" fill="#000">SharedGlucoseState</text>
  <text x="440" y="352" font-size="10.5" text-anchor="middle" fill="#000">last 24 readings</text>

  <!-- ============ RENDER LOOP ============ -->
  <rect x="650" y="150" width="330" height="236" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="815" y="180" font-size="13" text-anchor="middle" fill="#000">RENDER LOOP</text>

  <text x="672" y="212" font-size="11.5" fill="#000">is_playing ?</text>
  <text x="700" y="234" font-size="11.5" fill="#000">YES -&gt; album art + progress bar</text>
  <text x="700" y="256" font-size="11.5" fill="#000">NO  -&gt; glucose screen</text>

  <line x1="672" y1="274" x2="958" y2="274" stroke="#000" stroke-width="1"/>

  <text x="672" y="298" font-size="11" fill="#000">paused counts as not playing</text>
  <text x="672" y="320" font-size="11" fill="#000">scene change -&gt; swipe transition</text>
  <text x="672" y="342" font-size="11" fill="#000">frame key = art id + bar pixel</text>
  <text x="672" y="364" font-size="11" fill="#000">unchanged key -&gt; no write</text>

  <!-- ============ PANEL ============ -->
  <rect x="650" y="470" width="330" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="815" y="500" font-size="13" text-anchor="middle" fill="#000">64x64 LED PANEL</text>
  <text x="815" y="524" font-size="10.5" text-anchor="middle" fill="#000">SetImage + SwapOnVSync</text>

  <!-- ============ ARROWS ============ -->
  <path d="M240 193 L322 193" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>
  <path d="M240 343 L322 343" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>
  <path d="M550 193 L600 193 L600 232 L642 232" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>
  <path d="M550 343 L600 343 L600 254 L642 254" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>
  <path d="M815 386 L815 462" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>

  <!-- ============ NOTES ============ -->
  <rect x="40" y="470" width="560" height="210" fill="#fff" stroke="#000" stroke-width="1.4"/>
  <text x="60" y="500" font-size="12.5" fill="#000">WHY IT STAYS SMOOTH ON ONE ARMv6 CORE</text>
  <text x="60" y="530" font-size="11" fill="#000">- album art fetched at 64px, not 640px (a LANCZOS downscale costs ~3s)</text>
  <text x="60" y="554" font-size="11" fill="#000">- composed frame cached per progress-bar pixel (~1 redraw / 3s)</text>
  <text x="60" y="578" font-size="11" fill="#000">- identical frames never re-pushed (SetImage costs ~25ms)</text>
  <text x="60" y="602" font-size="11" fill="#000">- idles at 4fps; only animations run at full rate</text>
  <text x="60" y="626" font-size="11" fill="#000">- keep-alive HTTP session (a TLS handshake per poll stalls rendering)</text>
  <text x="60" y="650" font-size="11" fill="#000">- gc.freeze() after startup, so GC stops walking the cached images</text>

  <defs>
    <marker id="tip" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
</svg>
