<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#12141a"/>
  <text x="30" y="46" fill="#ffffff" font-size="26" font-weight="bold">The E address line — required for 64×64</text>
  <text x="30" y="74" fill="#9aa3b2" font-size="15">A 1/32-scan 64×64 panel needs five address lines (A–E). The bonnet leaves E unconnected by default.</text>

  <!-- board -->
  <rect x="60" y="120" width="360" height="300" rx="12" fill="#1d2230" stroke="#4da3ff" stroke-width="2.5"/>
  <text x="240" y="152" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Bonnet — solder jumper area</text>

  <!-- pads -->
  <circle cx="160" cy="230" r="26" fill="#12141a" stroke="#8892a4" stroke-width="2.5"/>
  <text x="160" y="236" fill="#e6e9ef" font-size="17" text-anchor="middle" font-weight="bold">8</text>
  <circle cx="240" cy="230" r="26" fill="#12141a" stroke="#8892a4" stroke-width="2.5"/>
  <text x="240" y="236" fill="#e6e9ef" font-size="17" text-anchor="middle" font-weight="bold">16</text>
  <circle cx="200" cy="320" r="26" fill="#12141a" stroke="#ffd166" stroke-width="3"/>
  <text x="200" y="326" fill="#ffd166" font-size="17" text-anchor="middle" font-weight="bold">E</text>

  <!-- solder blob -->
  <path d="M200 294 L165 256" stroke="#3ddc84" stroke-width="9" stroke-linecap="round"/>
  <circle cx="180" cy="275" r="9" fill="#3ddc84"/>
  <text x="300" y="300" fill="#3ddc84" font-size="15" font-weight="bold">solder bridge</text>
  <text x="300" y="322" fill="#3ddc84" font-size="15" font-weight="bold">E → 8</text>

  <text x="240" y="392" fill="#9aa3b2" font-size="13" text-anchor="middle">Bridge the centre E pad to the pad marked 8</text>

  <!-- symptoms panel -->
  <rect x="470" y="120" width="380" height="300" rx="12" fill="#1a1420" stroke="#ffd166" stroke-width="2"/>
  <text x="492" y="152" fill="#ffd166" font-size="16" font-weight="bold">If the panel looks wrong</text>

  <text x="492" y="190" fill="#e6e9ef" font-size="14" font-weight="bold">Top half duplicated / garbled</text>
  <text x="492" y="212" fill="#9aa3b2" font-size="13">→ E line wrong. Move the bridge to</text>
  <text x="492" y="232" fill="#9aa3b2" font-size="13">   pad 16 (some third-party panels).</text>

  <text x="492" y="272" fill="#e6e9ef" font-size="14" font-weight="bold">Completely dark</text>
  <text x="492" y="294" fill="#9aa3b2" font-size="13">→ Check 5V at the panel's own screw</text>
  <text x="492" y="314" fill="#9aa3b2" font-size="13">   terminals with a meter. A dark panel</text>
  <text x="492" y="334" fill="#9aa3b2" font-size="13">   looks identical powered or not.</text>

  <text x="492" y="374" fill="#e6e9ef" font-size="14" font-weight="bold">Nothing until software runs</text>
  <text x="492" y="396" fill="#9aa3b2" font-size="13">→ Normal. The panel only shows what</text>
  <text x="492" y="416" fill="#9aa3b2" font-size="13">   is actively clocked into it.</text>

  <text x="60" y="466" fill="#9aa3b2" font-size="13">config.txt parks the HUB75 pins at defined levels before the kernel starts, so the buffers never float:</text>
  <text x="60" y="492" fill="#4da3ff" font-size="13.5" font-family="DejaVu Sans Mono, monospace">gpio=4=op,dh    gpio=5,6,12,13,16,17,20,21,22,23,24,26,27=op,dl</text>
</svg>
